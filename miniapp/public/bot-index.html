<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>Master Control · Bot Commands</title><link rel="stylesheet" href="/bot-ui.css"><script defer src="https://telegram.org/js/telegram-web-app.js?63"></script><script defer src="/api-client.js"></script><script defer src="/bot-ui.js"></script></head>
<body><aside id="command-panel"><div class="brand"><span class="brand-icon">M</span><div>Master Control<small>TELEGRAM MINI APP</small></div></div><div class="menu-heading">BOT COMMANDS</div><nav id="command-menu" aria-label="Bot commands"></nav><div class="side-foot"><span id="mode">Connecting…</span><a href="/dashboard">Balance reports ↗</a></div></aside><div class="app"><header><button class="menu-button" id="toggle-menu" aria-label="Open commands">☰</button><div class="identity"><strong>Master Control</strong><span id="connection">Connecting to your bot…</span></div><span class="header-tag" id="workspace-tag">MINI APP</span><button class="icon-button" id="scroll-bottom" aria-label="Latest message">↓</button></header><main id="chat-scroll"><div class="chat-intro"><span>MASTER CONTROL</span><h1>Wahi bot. Wahi commands.</h1><p>Command chunein ya neeche message bhejein.</p></div><div id="messages" role="log" aria-live="polite" aria-label="Bot conversation"></div><div id="busy-status" class="busy-status" hidden></div></main><div class="composer-area"><div id="step-hint"></div><form id="message-form" autocomplete="off"><button type="button" class="attach-button" id="attach-file" aria-label="Photo or PDF upload">＋</button><input id="message-input" aria-label="Bot ko message bhejein" placeholder="Message ya /command bhejein…" maxlength="4096" autocomplete="off"><button class="send-button" type="submit" aria-label="Send message">↑</button></form><input id="file-input" type="file" accept="image/jpeg,image/png,application/pdf,text/plain" multiple hidden><div class="composer-foot"><span>Photo → auto scan · PDF → confirmation</span><button id="show-commands" type="button">/ Commands</button></div></div></div><div id="notice" role="status" hidden></div></body></html>
