name: master-control
x-app: &app
  build: .
  image: master-control:local
  restart: unless-stopped
  init: true
  network_mode: host
  env_file: ./private/config.env
  environment:
    BOT_DIR: /app/bot
    BOT_DATA_DIR: /data/bot
    MINIAPP_DATA_DIR: /data/reports
    MINIAPP_BRIDGE_DIR: /data/bridge
    MINIAPP_BRIDGE_PORT: "8790"
    MINIAPP_MODE: telegram
    PORT: "8787"
  volumes:
    - ./private/data:/data
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "3"
services:
  bot:
    <<: *app
    command: [node, /app/runtime/start.cjs, bot]
    healthcheck:
      test: [CMD, node, /app/runtime/health.cjs, bot]
      interval: 30s
      timeout: 5s
      retries: 3
  miniapp:
    <<: *app
    command: [node, /app/runtime/start.cjs, miniapp]
    depends_on:
      bot:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, /app/runtime/health.cjs, miniapp]
      interval: 30s
      timeout: 5s
      retries: 3
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    profiles: [cloudflare]
    env_file: ./private/tunnel.env
    command: [tunnel, --no-autoupdate, run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
